<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío de Cálculo Galáctico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="screen-home" class="screen">
        <h1>🚀 Desafío Galáctico</h1>
        <p>¡Resuelve las cuentas para ganar puntos!</p>
        <p>¡Acierta seguido para aumentar tu COMBO!</p>
        <button id="btn-start" class="btn-large">¡JUGAR!</button>
    </section>

    <section id="screen-game" class="screen hidden">
        
        <div class="stats-bar">
            <span>Puntos: <strong id="score">0</strong></span>
            <span>Tiempo: <strong id="timer">30</strong>s</span>
        </div>

        <div class="combo-container">
            <div id="combo-bar"></div>
        </div>

        <div class="problem-container">
            <div id="math-question">? + ?</div>
            <input type="number" id="user-answer" placeholder="=" autocomplete="off">
        </div>

        <div id="feedback-message"></div>
        
    </section>

    <section id="screen-result" class="screen hidden">
        <h2>¡Misión Completa!</h2>
        <p>Tu puntaje final es: <span id="final-score">0</span></p>
        <p>¿Listo para un nuevo viaje?</p>
        <button id="btn-restart" class="btn-large">Volver a Intentar</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
